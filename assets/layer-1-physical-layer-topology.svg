<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#13253d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 17px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 13px Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #94a3b8; }
      .switch { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .pc { fill: #111827; stroke: #22c55e; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .tool { fill: #0f172a; stroke: #f59e0b; stroke-width: 1.7; rx: 12; }
      .note { fill: #0f172a; stroke: #64748b; stroke-width: 1.2; rx: 12; }
      .good { stroke: #22c55e; stroke-width: 5; fill: none; }
      .bad { stroke: #ef4444; stroke-width: 5; stroke-dasharray: 12 8; fill: none; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="url(#bg)"/>
  <text x="50" y="55" class="title">Layer 1 Physical Layer Lab — Cabling, Link Lights, and Interface Status</text>
  <text x="50" y="82" class="subtitle">Portfolio lab for Cisco Packet Tracer: verify physical connectivity, administrative shutdown behavior, and Layer 1 troubleshooting workflow.</text>

  <rect x="420" y="210" width="260" height="145" class="switch"/>
  <text x="508" y="250" class="label">SW1</text>
  <text x="462" y="276" class="small">Cisco 2960 Switch</text>
  <text x="445" y="305" class="tiny">Check: link light, port state, speed/duplex</text>
  <text x="475" y="326" class="tiny">show interfaces status</text>

  <rect x="95" y="230" width="205" height="86" class="pc"/>
  <text x="160" y="264" class="label">PC1</text>
  <text x="123" y="289" class="small">192.168.10.10/24</text>
  <text x="123" y="309" class="tiny">FastEthernet0</text>

  <rect x="800" y="230" width="205" height="86" class="pc"/>
  <text x="865" y="264" class="label">PC2</text>
  <text x="828" y="289" class="small">192.168.10.20/24</text>
  <text x="828" y="309" class="tiny">FastEthernet0</text>

  <path d="M300 273 C350 273 375 258 420 258" class="good"/>
  <text x="318" y="247" class="tiny">Good copper link: PC1 F0 ↔ SW1 Fa0/1</text>

  <path d="M680 307 C730 307 755 273 800 273" class="bad"/>
  <text x="690" y="333" class="tiny">Troubleshooting fault: cable removed or Fa0/2 shutdown</text>

  <rect x="70" y="405" width="300" height="115" class="note"/>
  <text x="95" y="438" class="label">Layer 1 Checks</text>
  <text x="95" y="466" class="small">1. Cable connected and correct type</text>
  <text x="95" y="490" class="small">2. Link light green/up</text>
  <text x="95" y="514" class="small">3. Interface not administratively down</text>

  <rect x="410" y="405" width="300" height="115" class="tool"/>
  <text x="435" y="438" class="label">Verification Commands</text>
  <text x="435" y="466" class="small">show interfaces status</text>
  <text x="435" y="490" class="small">show interfaces fa0/2</text>
  <text x="435" y="514" class="small">show running-config interface fa0/2</text>

  <rect x="750" y="405" width="300" height="115" class="note"/>
  <text x="775" y="438" class="label">Expected Outcome</text>
  <text x="775" y="466" class="small">PC1 ↔ PC2 ping succeeds when link is up</text>
  <text x="775" y="490" class="small">Ping fails when cable/port is down</text>
  <text x="775" y="514" class="small">no shutdown restores connectivity</text>
</svg>
