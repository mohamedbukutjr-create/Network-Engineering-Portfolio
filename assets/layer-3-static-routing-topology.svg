<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Layer 3 Static Routing Packet Tracer Topology</title>
  <desc id="desc">PC1 connects through SW1 to router R1, across a /30 transit link to router R2, then through SW2 to Server1. Static routes provide end-to-end connectivity between the 192.168.10.0/24 client LAN and 192.168.30.0/24 server LAN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #e2e8f0; }
      .label { font: 600 14px Inter, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 11px Inter, Arial, sans-serif; fill: #94a3b8; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .lan { fill: rgba(14,165,233,0.12); stroke: #0ea5e9; stroke-dasharray: 8 6; stroke-width: 2; rx: 22; }
      .serverlan { fill: rgba(34,197,94,0.11); stroke: #22c55e; stroke-dasharray: 8 6; stroke-width: 2; rx: 22; }
      .warn { fill: rgba(251,146,60,0.12); stroke: #fb923c; stroke-width: 2; rx: 16; }
      .line { stroke: #38bdf8; stroke-width: 4; stroke-linecap: round; }
      .route { stroke: #fbbf24; stroke-width: 3; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .device { fill: #1e293b; stroke: #64748b; stroke-width: 2; rx: 12; }
      .router { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 16; }
      .switch { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 14; }
      .pc { fill: #3b0764; stroke: #c084fc; stroke-width: 2; rx: 14; }
      .server { fill: #7f1d1d; stroke: #f87171; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Foundational Networking — Layer 3 Static Routing Lab</text>
  <text x="60" y="86" class="subtitle">Cisco Packet Tracer portfolio project: IP addressing, gateways, routing tables, static routes, ping, and traceroute</text>

  <rect x="55" y="125" width="360" height="290" class="lan"/>
  <text x="76" y="155" class="section">Client LAN</text>
  <text x="76" y="178" class="small">192.168.10.0/24</text>

  <rect x="785" y="125" width="360" height="290" class="serverlan"/>
  <text x="806" y="155" class="section">Server LAN</text>
  <text x="806" y="178" class="small">192.168.30.0/24</text>

  <rect x="92" y="245" width="120" height="86" class="pc"/>
  <text x="124" y="274" class="label">PC1</text>
  <text x="109" y="299" class="small">192.168.10.10</text>
  <text x="113" y="318" class="tiny">GW 192.168.10.1</text>

  <rect x="276" y="245" width="112" height="86" class="switch"/>
  <text x="302" y="277" class="label">SW1</text>
  <text x="293" y="302" class="small">Layer 2</text>

  <rect x="476" y="230" width="120" height="116" class="router"/>
  <text x="512" y="263" class="label">R1</text>
  <text x="494" y="289" class="small">G0/0 .10.1</text>
  <text x="494" y="310" class="small">G0/1 10.0.12.1</text>
  <text x="502" y="331" class="tiny">Static route → R2</text>

  <rect x="604" y="230" width="120" height="116" class="router"/>
  <text x="640" y="263" class="label">R2</text>
  <text x="622" y="289" class="small">G0/0 10.0.12.2</text>
  <text x="622" y="310" class="small">G0/1 .30.1</text>
  <text x="630" y="331" class="tiny">Return route → R1</text>

  <rect x="812" y="245" width="112" height="86" class="switch"/>
  <text x="838" y="277" class="label">SW2</text>
  <text x="829" y="302" class="small">Layer 2</text>

  <rect x="986" y="245" width="120" height="86" class="server"/>
  <text x="1014" y="274" class="label">Server1</text>
  <text x="1000" y="299" class="small">192.168.30.10</text>
  <text x="1006" y="318" class="tiny">GW 192.168.30.1</text>

  <line x1="212" y1="288" x2="276" y2="288" class="line"/>
  <line x1="388" y1="288" x2="476" y2="288" class="line"/>
  <line x1="596" y1="288" x2="604" y2="288" class="line"/>
  <line x1="724" y1="288" x2="812" y2="288" class="line"/>
  <line x1="924" y1="288" x2="986" y2="288" class="line"/>

  <text x="605" y="205" text-anchor="middle" class="section">Transit Link: 10.0.12.0/30</text>
  <text x="426" y="276" class="tiny">G0/0</text>
  <text x="569" y="276" class="tiny">G0/1</text>
  <text x="608" y="276" class="tiny">G0/0</text>
  <text x="730" y="276" class="tiny">G0/1</text>

  <path d="M152 370 C280 505, 880 505, 1046 370" class="route"/>
  <text x="462" y="500" class="small" fill="#fde68a">ICMP test path: PC1 → R1 → R2 → Server1</text>
  <text x="461" y="524" class="tiny">Success requires a forward static route on R1 and a return static route on R2.</text>

  <rect x="75" y="455" width="330" height="130" class="box"/>
  <text x="100" y="487" class="section">R1 Static Route</text>
  <text x="100" y="517" class="small">ip route 192.168.30.0 255.255.255.0 10.0.12.2</text>
  <text x="100" y="544" class="tiny">Destination: Server LAN</text>
  <text x="100" y="565" class="tiny">Next hop: R2 transit interface</text>

  <rect x="795" y="455" width="330" height="130" class="box"/>
  <text x="820" y="487" class="section">R2 Return Route</text>
  <text x="820" y="517" class="small">ip route 192.168.10.0 255.255.255.0 10.0.12.1</text>
  <text x="820" y="544" class="tiny">Destination: Client LAN</text>
  <text x="820" y="565" class="tiny">Next hop: R1 transit interface</text>

  <rect x="435" y="555" width="330" height="82" class="warn"/>
  <text x="458" y="586" class="section">Troubleshooting Case</text>
  <text x="458" y="613" class="small">Remove R2 return route → ping fails.</text>
  <text x="458" y="633" class="tiny">Fix by restoring the route and verifying with show ip route + ping.</text>
</svg>
