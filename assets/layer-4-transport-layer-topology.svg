<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Layer 4 Transport Layer TCP UDP and Ports Lab</title>
  <desc id="desc">Client tests TCP and UDP application ports through an enterprise firewall to web, DNS, SSH, and internal application servers. The diagram highlights TCP handshake, UDP datagrams, ephemeral source ports, and port troubleshooting outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #e2e8f0; }
      .label { font: 700 15px Inter, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 11px Inter, Arial, sans-serif; fill: #94a3b8; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .client { fill: #3b0764; stroke: #c084fc; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .network { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .firewall { fill: #7f1d1d; stroke: #fb7185; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .server { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .cloud { fill: rgba(14,165,233,0.12); stroke: #0ea5e9; stroke-dasharray: 8 6; stroke-width: 2; rx: 24; }
      .tcp { stroke: #38bdf8; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .udp { stroke: #fbbf24; stroke-width: 4; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowAmber); }
      .ok { stroke: #22c55e; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
      .blocked { stroke: #fb7185; stroke-width: 4; fill: none; stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="58" y="58" class="title">Foundational Networking — Layer 4 Transport Layer Lab</text>
  <text x="58" y="86" class="subtitle">TCP vs UDP, ports, sockets, three-way handshake, service listening checks, and firewall troubleshooting</text>

  <rect x="60" y="135" width="290" height="235" class="cloud"/>
  <text x="82" y="166" class="section">User / Support Side</text>

  <rect x="110" y="215" width="175" height="104" class="client"/>
  <text x="158" y="247" class="label">Client PC</text>
  <text x="135" y="274" class="small">192.168.1.5</text>
  <text x="119" y="296" class="tiny">Ephemeral source ports:</text>
  <text x="139" y="314" class="tiny">51234, 51235, 54100</text>

  <rect x="430" y="215" width="145" height="104" class="network"/>
  <text x="469" y="247" class="label">Router</text>
  <text x="453" y="274" class="small">Layer 3 path</text>
  <text x="446" y="296" class="tiny">Ping/traceroute OK</text>

  <rect x="665" y="200" width="150" height="134" class="firewall"/>
  <text x="700" y="233" class="label">Firewall</text>
  <text x="686" y="260" class="small">Layer 4 policy</text>
  <text x="686" y="282" class="tiny">Allow: TCP 443</text>
  <text x="686" y="300" class="tiny">Allow: UDP 53</text>
  <text x="686" y="318" class="tiny">Deny/Drop: TCP 25</text>

  <rect x="910" y="125" width="215" height="84" class="server"/>
  <text x="964" y="156" class="label">Web Server</text>
  <text x="946" y="181" class="small">10.50.8.20:443/TCP</text>

  <rect x="910" y="245" width="215" height="84" class="server"/>
  <text x="974" y="276" class="label">DNS Server</text>
  <text x="947" y="301" class="small">10.50.1.53:53/UDP+TCP</text>

  <rect x="910" y="365" width="215" height="84" class="server"/>
  <text x="975" y="396" class="label">SSH Server</text>
  <text x="958" y="421" class="small">10.50.9.22:22/TCP</text>

  <line x1="285" y1="267" x2="430" y2="267" class="tcp"/>
  <line x1="575" y1="267" x2="665" y2="267" class="tcp"/>
  <path d="M815 245 C850 205, 870 174, 910 167" class="ok"/>
  <path d="M815 278 C850 280, 875 286, 910 287" class="udp"/>
  <path d="M815 315 C850 360, 872 398, 910 407" class="tcp"/>

  <text x="347" y="246" class="tiny">IP routing must work first</text>
  <text x="834" y="148" class="tiny">HTTPS test:</text>
  <text x="834" y="166" class="tiny">nc -zv host 443</text>
  <text x="835" y="286" class="tiny">DNS query:</text>
  <text x="835" y="304" class="tiny">UDP/TCP 53</text>
  <text x="835" y="407" class="tiny">SSH test:</text>
  <text x="835" y="425" class="tiny">TCP 22</text>

  <rect x="70" y="430" width="330" height="210" class="box"/>
  <text x="96" y="463" class="section">TCP Three-Way Handshake</text>
  <text x="96" y="498" class="small">1. Client → Server: SYN</text>
  <text x="96" y="526" class="small">2. Server → Client: SYN-ACK</text>
  <text x="96" y="554" class="small">3. Client → Server: ACK</text>
  <text x="96" y="590" class="tiny">After this, application data flows reliably.</text>
  <text x="96" y="613" class="tiny">TCP provides sequence numbers, ACKs, retransmission,</text>
  <text x="96" y="631" class="tiny">flow control, and ordered delivery.</text>

  <rect x="435" y="430" width="330" height="210" class="box"/>
  <text x="461" y="463" class="section">UDP Datagrams</text>
  <text x="461" y="498" class="small">No connection setup</text>
  <text x="461" y="526" class="small">No built-in delivery guarantee</text>
  <text x="461" y="554" class="small">Lower overhead and fast</text>
  <text x="461" y="590" class="tiny">Used by DNS, DHCP, NTP, SNMP, VoIP, streaming,</text>
  <text x="461" y="613" class="tiny">gaming, and QUIC/HTTP/3.</text>

  <rect x="800" y="500" width="330" height="140" class="box"/>
  <text x="826" y="533" class="section">Troubleshooting Outcomes</text>
  <text x="826" y="566" class="small">Connection succeeded = port reachable</text>
  <text x="826" y="594" class="small">Connection refused = host up, no listener</text>
  <text x="826" y="622" class="small">Connection timed out = firewall/drop/path issue</text>
</svg>
