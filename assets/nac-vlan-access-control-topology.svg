<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .bg{fill:#020617}.grid{stroke:#1e293b;stroke-width:.7}.title{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:800}.subtitle{fill:#cbd5e1;font-family:Arial,Helvetica,sans-serif;font-size:16px}.router{fill:#3b2f0f;stroke:#fbbf24;stroke-width:3;rx:14}.switch{fill:#06382f;stroke:#34d399;stroke-width:3;rx:14}.staff{fill:#082f49;stroke:#38bdf8;stroke-width:3;rx:14}.guest{fill:#422006;stroke:#fb923c;stroke-width:3;rx:14}.quar{fill:#4c0519;stroke:#fb7185;stroke-width:3;rx:14}.label{fill:#f8fafc;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700}.small{fill:#cbd5e1;font-family:Arial,Helvetica,sans-serif;font-size:15px}.ip{fill:#bfdbfe;font-family:Arial,Helvetica,sans-serif;font-size:14px}.link{stroke:#94a3b8;stroke-width:5;stroke-linecap:round}.trunk{stroke:#fbbf24;stroke-width:6;stroke-dasharray:12 8;stroke-linecap:round}.acl{stroke:#fb7185;stroke-width:3;stroke-dasharray:7 6;marker-end:url(#arrow)}.tagtext{fill:#e2e8f0;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700}.vlan{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:800}.v10{fill:#7dd3fc}.v20{fill:#fdba74}.v99{fill:#fda4af}.note{fill:#0f172a;stroke:#475569;stroke-width:2;rx:10}.notetext{fill:#cbd5e1;font-family:Arial,Helvetica,sans-serif;font-size:14px}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620"/><rect width="1200" height="620" fill="url(#grid)" opacity="0.75"/>
  <text x="600" y="42" text-anchor="middle" class="title">NAC VLAN Access Control Lab</text>
  <text x="600" y="69" text-anchor="middle" class="subtitle">Simulated NAC decisions: Staff approved, Guest limited, Unknown quarantined</text>
  <line x1="600" y1="175" x2="600" y2="285" class="trunk"/>
  <line x1="600" y1="395" x2="275" y2="470" class="link"/><line x1="600" y1="395" x2="600" y2="470" class="link"/><line x1="600" y1="395" x2="925" y2="470" class="link"/>
  <rect x="455" y="105" width="290" height="95" class="router"/><text x="600" y="145" text-anchor="middle" class="label">R1-NAC-Gateway</text><text x="600" y="170" text-anchor="middle" class="small">Router-on-a-stick subinterfaces</text><text x="600" y="190" text-anchor="middle" class="ip">.10 / .20 / .99 gateways</text>
  <rect x="455" y="285" width="290" height="110" class="switch"/><text x="600" y="328" text-anchor="middle" class="label">SW1-NAC-Access</text><text x="600" y="355" text-anchor="middle" class="small">2960 Access Switch</text><text x="600" y="378" text-anchor="middle" class="ip">Fa0/24 trunk to router</text>
  <rect x="130" y="470" width="290" height="105" class="staff"/><text x="275" y="510" text-anchor="middle" class="label">PC-STAFF</text><text x="275" y="536" text-anchor="middle" class="ip">192.168.10.10 / VLAN 10</text><text x="275" y="558" text-anchor="middle" class="small">Approved corporate endpoint</text><text x="275" y="453" text-anchor="middle" class="vlan v10">Fa0/1 ACCESS VLAN 10 STAFF</text>
  <rect x="455" y="470" width="290" height="105" class="guest"/><text x="600" y="510" text-anchor="middle" class="label">PC-GUEST</text><text x="600" y="536" text-anchor="middle" class="ip">192.168.20.10 / VLAN 20</text><text x="600" y="558" text-anchor="middle" class="small">Limited guest endpoint</text><text x="600" y="453" text-anchor="middle" class="vlan v20">Fa0/2 ACCESS VLAN 20 GUEST</text>
  <rect x="780" y="470" width="290" height="105" class="quar"/><text x="925" y="510" text-anchor="middle" class="label">PC-UNKNOWN</text><text x="925" y="536" text-anchor="middle" class="ip">192.168.99.10 / VLAN 99</text><text x="925" y="558" text-anchor="middle" class="small">Quarantine endpoint</text><text x="925" y="453" text-anchor="middle" class="vlan v99">Fa0/3 ACCESS VLAN 99 QUARANTINE</text>
  <path d="M600 470 C540 420, 430 410, 310 470" fill="none" class="acl"/><text x="425" y="420" class="tagtext">ACL blocks Guest → Staff</text>
  <path d="M925 470 C820 390, 470 390, 300 470" fill="none" class="acl"/><text x="740" y="382" class="tagtext">ACL blocks Quarantine → Staff/Guest</text>
  <rect x="60" y="90" width="300" height="90" class="note"/><text x="80" y="120" class="notetext">Real NAC equivalent:</text><text x="80" y="144" class="notetext">Cisco ISE / ClearPass uses 802.1X,</text><text x="80" y="166" class="notetext">RADIUS, MAB, VLAN assignment, ACLs.</text>
  <rect x="830" y="90" width="310" height="90" class="note"/><text x="850" y="120" class="notetext">Lab simulation:</text><text x="850" y="144" class="notetext">Manual VLAN placement + router ACLs</text><text x="850" y="166" class="notetext">to model access-control policy.</text>
</svg>
