<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 16px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 13px Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #94a3b8; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .pc { fill: #111827; stroke: #22c55e; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .problem { fill: #3f1d1d; stroke: #ef4444; stroke-width: 2; rx: 12; }
      .line { stroke: #38bdf8; stroke-width: 4; fill: none; }
      .line2 { stroke: #22c55e; stroke-width: 4; fill: none; }
      .badline { stroke: #ef4444; stroke-width: 4; stroke-dasharray: 10 7; fill: none; }
      .vlan10 { fill: #064e3b; stroke: #22c55e; stroke-width: 1.5; rx: 8; }
      .vlan20 { fill: #3b0764; stroke: #c084fc; stroke-width: 1.5; rx: 8; }
      .note { fill: #0f172a; stroke: #64748b; stroke-width: 1.2; rx: 12; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="url(#bg)"/>
  <text x="50" y="55" class="title">Layer 2 Data Link Lab — Switching, MAC Learning, and VLAN Isolation</text>
  <text x="50" y="82" class="subtitle">Portfolio lab for Cisco Packet Tracer: verify MAC address learning, Ethernet switching, VLAN separation, and Layer 2 troubleshooting.</text>

  <!-- Switch -->
  <rect x="420" y="210" width="260" height="150" class="box"/>
  <text x="505" y="250" class="label">SW1</text>
  <text x="464" y="276" class="small">Cisco 2960 Access Switch</text>
  <text x="448" y="306" class="tiny">Learns source MAC addresses</text>
  <text x="456" y="326" class="tiny">Forwards frames by MAC table</text>

  <!-- VLAN containers -->
  <rect x="55" y="145" width="280" height="260" class="vlan10"/>
  <text x="78" y="175" class="label">VLAN 10 — STAFF</text>
  <text x="78" y="197" class="small">192.168.10.0/24</text>

  <rect x="765" y="145" width="280" height="260" class="vlan20"/>
  <text x="788" y="175" class="label">VLAN 20 — GUEST</text>
  <text x="788" y="197" class="small">192.168.20.0/24</text>

  <!-- PCs -->
  <rect x="92" y="240" width="190" height="72" class="pc"/>
  <text x="153" y="270" class="label">PC1</text>
  <text x="115" y="293" class="small">192.168.10.10</text>
  <text x="115" y="312" class="tiny">MAC learned on Fa0/1</text>

  <rect x="92" y="330" width="190" height="72" class="pc"/>
  <text x="153" y="360" class="label">PC2</text>
  <text x="115" y="383" class="small">192.168.10.20</text>
  <text x="115" y="402" class="tiny">Same VLAN as PC1</text>

  <rect x="818" y="260" width="190" height="72" class="pc"/>
  <text x="879" y="290" class="label">PC3</text>
  <text x="841" y="313" class="small">192.168.20.10</text>
  <text x="841" y="332" class="tiny">Different VLAN</text>

  <!-- Links -->
  <path d="M282 276 C340 276 360 250 420 250" class="line2"/>
  <text x="314" y="262" class="tiny">Fa0/1 access VLAN 10</text>

  <path d="M282 366 C342 366 360 322 420 322" class="line2"/>
  <text x="308" y="386" class="tiny">Fa0/2 access VLAN 10</text>

  <path d="M680 288 C730 288 760 296 818 296" class="line"/>
  <text x="688" y="276" class="tiny">Fa0/3 access VLAN 20</text>

  <!-- Expected behavior -->
  <rect x="55" y="448" width="330" height="105" class="note"/>
  <text x="78" y="478" class="label">Expected Layer 2 Result</text>
  <text x="78" y="504" class="small">PC1 ↔ PC2 ping works inside VLAN 10.</text>
  <text x="78" y="528" class="small">PC1 ↔ PC3 ping fails without routing.</text>

  <rect x="425" y="448" width="290" height="105" class="note"/>
  <text x="448" y="478" class="label">Verification Commands</text>
  <text x="448" y="504" class="small">show mac address-table</text>
  <text x="448" y="528" class="small">show vlan brief</text>

  <rect x="755" y="448" width="290" height="105" class="problem"/>
  <text x="778" y="478" class="label">Troubleshooting Case</text>
  <text x="778" y="504" class="small">Wrong VLAN assignment causes</text>
  <text x="778" y="528" class="small">same-subnet hosts to stop communicating.</text>
</svg>
